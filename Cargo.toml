[workspace]
resolver = "2"
members = [
    "crates/tianyi-core",
    "crates/tianyi-app",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
# 与仓库根 LICENSE 一致。cargo-deny 的 licenses 检查按清单里的这个字段认领
# 工作区 crate，缺了它两个 crate 都会被判成 "unlicensed"。
license = "GPL-3.0-only"
# slint 1.17.1 自身声明 rust-version = 1.92（cargo metadata 实测的依赖下限），
# 1.75 只是历史遗留的假设值，无法成立；CI 的 msrv 作业按此值校验。
rust-version = "1.92"

[profile.release]
opt-level = 2
lto = "thin"
codegen-units = 1
strip = true

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "stream", "rustls-tls", "cookies"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
md-5 = "0.10"
sha1 = "0.10"
hmac = "0.12"
rsa = "0.9"
aes = "0.8"
cbc = "0.1"
hex = "0.4"
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }
url = "2"
regex = "1"
log = "0.4"
env_logger = "0.11"
dirs = "6"
futures = "0.3"
tokio-util = { version = "0.7", features = ["io"] }
bytes = "1"
chrono = { version = "0.4", features = ["clock"] }
rand = "0.8"
arboard = "3"
