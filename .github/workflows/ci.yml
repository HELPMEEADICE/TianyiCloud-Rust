name: CI

# 语法 / 代码检查：
#   * cargo fmt   —— 格式（严格门禁）
#   * cargo clippy —— 静态检查（-D warnings，严格门禁）
#   * cargo check  —— 三平台（Linux / Windows / macOS）编译校验
#   * cargo test   —— 单元测试

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "LICENSE"
      - ".gitignore"
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # ---------------------------------------------------------------- 格式检查
  fmt:
    name: 格式检查 (rustfmt)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: cargo fmt --all --check
        run: cargo fmt --all -- --check

  # ---------------------------------------------------------------- 静态检查
  clippy:
    name: 静态检查 (clippy, -D warnings)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Linux GUI 依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libfontconfig1-dev libfreetype6-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libwayland-dev libgl1-mesa-dev libegl1-mesa-dev \
            libx11-dev libxcursor-dev libxrandr-dev libxi-dev libxinerama-dev \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          key: ci-clippy

      - name: cargo clippy --workspace --all-targets -- -D warnings
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  # ---------------------------------------------------------------- 编译校验
  check:
    name: 编译校验 (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x64, os: ubuntu-22.04, target: x86_64-unknown-linux-gnu }
          - { name: windows-x64, os: windows-2022, target: x86_64-pc-windows-msvc }
          - { name: macos-arm64, os: macos-latest, target: aarch64-apple-darwin }
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Linux GUI 依赖
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libfontconfig1-dev libfreetype6-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libwayland-dev libgl1-mesa-dev libegl1-mesa-dev \
            libx11-dev libxcursor-dev libxrandr-dev libxi-dev libxinerama-dev \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ci-check-${{ matrix.target }}

      - name: cargo check
        run: cargo check --workspace --all-targets --locked --target ${{ matrix.target }}

  # ---------------------------------------------------------------- 单元测试
  test:
    name: 单元测试 (linux-x64)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Linux GUI 依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libfontconfig1-dev libfreetype6-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libwayland-dev libgl1-mesa-dev libegl1-mesa-dev \
            libx11-dev libxcursor-dev libxrandr-dev libxi-dev libxinerama-dev \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: ci-test

      - name: cargo test
        run: cargo test --workspace --locked

  # ---------------------------------------------------------------- 汇总门禁
  ci:
    name: CI 汇总
    if: always()
    needs: [fmt, clippy, check, test]
    runs-on: ubuntu-latest
    steps:
      - name: 检查各任务结果
        run: |
          echo "fmt=${{ needs.fmt.result }} clippy=${{ needs.clippy.result }} check=${{ needs.check.result }} test=${{ needs.test.result }}"
          if [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" = "true" ]; then
            echo "存在失败的任务" >&2
            exit 1
          fi
