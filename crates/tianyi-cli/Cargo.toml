[package]
name = "tianyi-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "天翼云盘 Headless CLI（无图形依赖，供 SSH / Docker / 自动化 / AI Agent 使用）"

[lib]
name = "tianyi_cli"
path = "src/lib.rs"

[dependencies]
tianyi-core = { path = "../tianyi-core" }
# 只读网络挂载：mount / unmount / mounts 必须调用**真的**挂载实现，
# 否则"--read-only 零磁盘缓存"就只是一句文案。该 crate 往下只有 tokio / reqwest /
# windows-sys / winreg（WinFsp 是运行时动态加载），不会把任何图形依赖带进 CLI。
tianyi-mount = { path = "../tianyi-mount" }
tokio.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
anyhow.workspace = true
log.workspace = true
env_logger.workspace = true
dirs.workspace = true
chrono.workspace = true
base64.workspace = true
# 类型安全的参数解析：不知名参数、缺值、类型错误都由它统一报错并给帮助
clap = { version = "4", features = ["derive", "wrap_help"] }
# REPL：历史 / 补全 / 行编辑。关闭默认 feature（不需要文件历史、自定义键位与 dirs），
# 历史由本 crate 自己读写，依赖更少。
rustyline = { version = "19", default-features = false }
# 隐藏输入（密码）：Unix 用 termios、Windows 用控制台 API，不引入手写平台代码
rpassword = "7"
# 终端二维码：纯文本渲染（半块字符），不依赖任何图形库
qrcode = "0.14"

# 跨进程卸载要判断「注册表里那个 PID 还活着吗」。Windows 没有 /proc，
# 只能用 OpenProcess + GetExitCodeProcess；为了这一点点 API 拖进 windows-sys，
# 而不是起一个 tasklist 子进程（一次卸载要探测几十次）。
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
] }
