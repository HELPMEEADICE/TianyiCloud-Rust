[package]
name = "tianyi-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
tianyi-core = { path = "../tianyi-core" }
slint = { version = "1.17", features = ["unstable-winit-030"] }
tokio.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
anyhow.workspace = true
log.workspace = true
env_logger.workspace = true
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "bmp", "webp"] }
qrcode = "0.14"
base64.workspace = true
dirs.workspace = true
uuid.workspace = true
rfd = "0.15"
arboard.workspace = true

# Windows 专有依赖：拖出下载（COM DoDragDrop）与系统 API
[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "implement",
    "Win32_Foundation",
    "Win32_System_Ole",
    "Win32_System_Com",
    "Win32_UI_Shell",
    "Win32_System_Memory",
    "Win32_System_SystemServices",
    "Win32_System_Com_StructuredStorage",
    "Win32_Graphics_Gdi",
    "Win32_UI_Input_KeyboardAndMouse",
] }
windows-core = "0.58"

[build-dependencies]
slint-build = "1.17"

[features]
# 图标总览组件（ui/dev/icon-sheet.slint，近 6000 行）只为 examples/icon_sheet.rs
# 的视觉自检服务，主界面 ui/main.slint 不引用它：常规构建不编译。
icon-sheet = []

[[example]]
name = "icon_sheet"
required-features = ["icon-sheet"]
